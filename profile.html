<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Profile - Rittik Mobile Shop</title>
    <meta name="theme-color" content="#0f172a"/>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #e2e8f0; padding-bottom: 70px; }
        
        .header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 2px solid #00e5ff; position: sticky; top: 0; z-index: 50; }
        .header h2 { color: #00e5ff; margin: 0; }

        .profile-card { background: #1e293b; margin: 20px; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #00e5ff; margin: 0 auto 10px auto; object-fit: cover;}
        .profile-name { font-size: 20px; font-weight: bold; color: white; margin-bottom: 5px; }
        .profile-email { font-size: 14px; color: #94a3b8; }

        /* Tabs */
        .tabs { display: flex; justify-content: space-around; background: #1e293b; margin: 20px; border-radius: 10px; overflow: hidden; border: 1px solid #334155;}
        .tab-btn { flex: 1; padding: 12px; background: transparent; color: #94a3b8; border: none; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: #00e5ff; color: #0f172a; }

        .section-content { display: none; padding: 0 20px; }
        .section-content.active { display: block; }

        /* Order & Sell Cards */
        .list-card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; position: relative;}
        .list-title { font-weight: bold; font-size: 16px; color: white; margin-bottom: 8px;}
        .list-status { font-size: 13px; font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block;}
        .status-pending { background: #f59e0b; color: #fff; }
        .status-accepted { background: #10b981; color: #fff; }
        .status-rejected { background: #ef4444; color: #fff; }
        .btn-cancel { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; margin-top: 10px; cursor: pointer;}
        
        /* Order Tracking Timeline */
        .tracking-bar { display: flex; justify-content: space-between; margin-top: 15px; position: relative; }
        .tracking-bar::before { content: ''; position: absolute; top: 10px; left: 10%; right: 10%; height: 2px; background: #334155; z-index: 1;}
        .step { text-align: center; z-index: 2; position: relative;}
        .dot { width: 20px; height: 20px; background: #334155; border-radius: 50%; margin: 0 auto 5px auto; border: 2px solid #0f172a;}
        .step.active .dot { background: #00e5ff; box-shadow: 0 0 10px #00e5ff;}
        .step-txt { font-size: 10px; color: #94a3b8; }
        .step.active .step-txt { color: #00e5ff; }

        .logout-btn { display: block; margin: 30px 20px; text-align: center; background: #ef4444; color: white; padding: 15px; border-radius: 10px; font-weight: bold; text-decoration: none; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #1e293b; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; z-index: 100;}
        .nav-item { text-align: center; color: #94a3b8; text-decoration: none; font-size: 12px; }
        .nav-item.active { color: #00e5ff; }
        .nav-item img { width: 24px; height: 24px; display: block; margin: 0 auto 3px auto; opacity: 0.5; filter: invert(1);}
        .nav-item.active img { opacity: 1; filter: invert(70%) sepia(45%) saturate(3000%) hue-rotate(150deg) brightness(100%) contrast(100%); }
    </style>
</head>
<body>

    <div class="header"><h2>My Profile</h2></div>

    <div class="profile-card">
        <img src="https://via.placeholder.com/80" alt="Profile" class="profile-img" id="userPhoto">
        <div class="profile-name" id="userName">Loading...</div>
        <div class="profile-email" id="userEmail">Please log in</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('orders')">My Orders</button>
        <button class="tab-btn" onclick="switchTab('sell')">Sell Requests</button>
        <button class="tab-btn" onclick="switchTab('fav')">Favorites</button>
    </div>

    <!-- My Orders Section -->
    <div id="orders" class="section-content active">
        <!-- Example Order tracking -->
        <div class="list-card">
            <div class="list-title">iPhone 13 Pro (Example)</div>
            <p style="font-size: 13px; color: #94a3b8;">Order ID: #ORD12345</p>
            <div class="tracking-bar">
                <div class="step active"><div class="dot"></div><div class="step-txt">Ordered</div></div>
                <div class="step active"><div class="dot"></div><div class="step-txt">Shipped</div></div>
                <div class="step"><div class="dot"></div><div class="step-txt">Out for Delivery</div></div>
                <div class="step"><div class="dot"></div><div class="step-txt">Delivered</div></div>
            </div>
        </div>
        <div id="dynamicOrders"></div>
    </div>

    <!-- Sell History Section -->
    <div id="sell" class="section-content">
        <div id="dynamicSells"></div>
    </div>

    <!-- Favorites Section -->
    <div id="fav" class="section-content">
        <p style="text-align:center; color:#94a3b8; margin-top:20px;">No favorite items yet.</p>
    </div>

    <a href="#" class="logout-btn" id="logoutBtn">Log Out</a>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><img src="https://s3ng.cashify.in/builder/f635449b43954fd1af1d88e7272d5dc2.webp"> Home</a>
        <a href="index.html#productGrid" class="nav-item"><img src="https://s3ng.cashify.in/builder/42a5409869a84e73921df8c033a81c9d.webp"> Buy</a>
        <a href="sell.html" class="nav-item"><img src="https://s3ng.cashify.in/builder/31d6a6d498ca43d4a6eee6cccd421474.webp"> Sell</a>
        <a href="profile.html" class="nav-item active"><img src="https://s3ng.cashify.in/builder/60cc75a071de4f729b9377681e594821.webp"> Profile</a>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIddmdEKtGl0OI97ky6Q3JJBs2dOzbnbA",
            authDomain: "rittik-mobile-shop-web-1.firebaseapp.com",
            databaseURL: "https://rittik-mobile-shop-web-1-default-rtdb.firebaseio.com",
            projectId: "rittik-mobile-shop-web-1",
            storageBucket: "rittik-mobile-shop-web-1.firebasestorage.app",
            messagingSenderId: "171512039750",
            appId: "1:171512039750:web:639dd1bffdb351bf06fd47"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('userPhoto').src = user.photoURL;
                loadUserSells(user.uid);
                // loadUserOrders(user.uid); // Will be implemented with details.html logic
            } else {
                alert("Please login first!");
                window.location.href = "index.html";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });

        window.switchTab = function(tabId) {
            document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function loadUserSells(uid) {
            onValue(ref(db, 'sell_requests'), (snapshot) => {
                const box = document.getElementById('dynamicSells');
                box.innerHTML = '';
                const data = snapshot.val();
                if(data) {
                    Object.keys(data).reverse().forEach(key => {
                        const req = data[key];
                        if(req.userId === uid) {
                            let statusTxt = req.status === 'accepted' ? 'Accepted' : (req.status === 'rejected' ? 'Rejected' : 'Pending Review');
                            let statusClass = req.status === 'accepted' ? 'status-accepted' : (req.status === 'rejected' ? 'status-rejected' : 'status-pending');
                            
                            let cancelBtn = req.status === 'pending' || !req.status ? `<button class="btn-cancel" onclick="cancelSell('${key}')">Cancel Request</button>` : '';

                            box.innerHTML += `
                                <div class="list-card" id="req_${key}">
                                    <div class="list-title">${req.deviceModel}</div>
                                    <p style="color: #94a3b8; font-size:13px; margin-bottom: 5px;">Expected: ₹${req.expectedPrice}</p>
                                    <span class="list-status ${statusClass}">${statusTxt}</span>
                                    <br>${cancelBtn}
                                </div>
                            `;
                        }
                    });
                }
                if(box.innerHTML === '') box.innerHTML = '<p style="text-align:center; color:#94a3b8;">No sell requests found.</p>';
            });
        }

        window.cancelSell = function(key) {
            if(confirm("Are you sure you want to cancel this sell request?")) {
                remove(ref(db, 'sell_requests/' + key));
            }
        }
    </script>
</body>
</html>
