<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rittik Mobile Shop</title>
    
    <!-- Open Graph for Link Preview (WhatsApp/Facebook) -->
    <meta property="og:title" content="Rittik Mobile Shop">
    <meta property="og:description" content="Buy and Sell Premium Devices easily.">
    <meta property="og:image" content="https://samimaktar-hw.github.io/RITTIK/logo.png">
    <meta name="theme-color" content="#0f172a"/>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0b1121; color: #f8fafc; padding-bottom: 75px; overflow-x: hidden;}
        
        /* Splash Screen Animation */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b1121; display: flex; align-items: center; justify-content: center; z-index: 9999; animation: fadeOut 0.5s ease 2s forwards; }
        #splashScreen img { width: 100px; height: 100px; animation: popIn 0.8s ease forwards; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeOut { 100% { opacity: 0; visibility: hidden; } }

        /* Main Content wrapper (hidden initially) */
        #mainContent { opacity: 0; animation: fadeIn 0.5s ease 2.5s forwards; }
        @keyframes fadeIn { 100% { opacity: 1; } }

        /* Glassmorphism Header */
        .header { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(0, 229, 255, 0.3); }
        .logo-section { display: flex; align-items: center; text-decoration: none; gap: 10px; }
        .logo-img { height: 35px; width: 35px; object-fit: contain; border-radius: 6px; }
        .logo-text { color: #ffffff; margin: 0; font-size: 18px; font-weight: 800; }
        .logo-text span { color: #00e5ff; }
        
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .login-btn { background: #00e5ff; color: #0f172a; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; cursor: pointer;}
        
        /* Avatar Text */
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; display: none; cursor: pointer; object-fit: cover; border: 2px solid #00e5ff;}
        .text-avatar { width: 32px; height: 32px; border-radius: 50%; background: #00e5ff; color: #0f172a; font-weight: bold; display: none; align-items: center; justify-content: center; font-size: 14px; cursor: pointer;}

        /* Live Search Bar */
        .search-container { padding: 10px 20px; background: #0f172a; position: relative; z-index: 40; border-bottom: 1px solid #1e293b;}
        .search-box { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; font-size: 14px;}
        .search-box:focus { border-color: #00e5ff; }
        
        /* Search Dropdown */
        .search-dropdown { position: absolute; top: 55px; left: 20px; right: 20px; background: #1e293b; border-radius: 8px; border: 1px solid #334155; max-height: 250px; overflow-y: auto; display: none; z-index: 100;}
        .search-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; text-decoration: none; color: white;}
        .search-item img { width: 30px; height: 30px; object-fit: contain; margin-right: 15px;}

        /* Scrolling Brands */
        .brand-scroll { display: flex; overflow-x: auto; padding: 15px 20px; gap: 15px; background: rgba(30, 41, 59, 0.4); border-bottom: 1px solid #1e293b; }
        .brand-scroll::-webkit-scrollbar { display: none; }
        .brand-icon { width: 50px; height: 50px; background: #1e293b; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid #334155;}
        .brand-icon img { width: 30px; height: 30px; object-fit: contain; }

        /* Banner */
        .banner { background: radial-gradient(circle at top right, #0284c7, #0f172a 70%); padding: 30px 20px; text-align: center; }
        .banner h2 { font-size: 22px; margin-bottom: 8px; color: #00e5ff;}
        .banner p { font-size:14px; color:#94a3b8; }

        /* Premium Services Grid (Restored) */
        .services-section { padding: 25px 20px 10px 20px; }
        .section-title { font-size: 18px; margin-bottom: 18px; color: #f8fafc; font-weight: 700; display: flex; align-items: center; gap: 8px;}
        .section-title::before { content: ''; display: inline-block; width: 4px; height: 18px; background: #00e5ff; border-radius: 4px;}
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
        .service-box { text-decoration: none; color: #cbd5e1; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; transition: 0.3s;}
        .service-box:hover { transform: translateY(-3px); color: #00e5ff;}
        .service-icon { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; transition: 0.3s;}
        .service-box:hover .service-icon { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.2);}
        .service-icon img { width: 32px; height: 32px; object-fit: contain; }

        /* Product Cards */
        .products-section { padding: 10px 20px 30px 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .product-card { background: #1e293b; border-radius: 12px; padding: 10px; text-align: center; border: 1px solid #334155; position: relative;}
        
        /* Fav Icon (Love Button) */
        .fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-size: 16px; color: #fff;}
        .fav-btn.active { color: #ef4444; }

        .slider-container { width: 100%; height: 140px; display: flex; justify-content: center; align-items: center; background: white; border-radius: 8px; margin-bottom: 10px; position: relative;}
        .slider-container img { max-width: 90%; max-height: 90%; object-fit: contain;}
        .p-title { font-size: 13px; font-weight: 700; color: #f1f5f9; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .p-price { font-size: 16px; color: #00e5ff; font-weight: bold;}
        
        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; z-index: 100;}
        .nav-item { text-align: center; color: #64748b; text-decoration: none; font-size: 11px; font-weight: 600;}
        .nav-item.active { color: #00e5ff; }
        .nav-item img { width: 20px; height: 20px; display: block; margin: 0 auto 4px auto; filter: invert(0.5);}
        .nav-item.active img { filter: invert(70%) sepia(45%) saturate(3000%) hue-rotate(150deg); }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splashScreen">
        <img src="logo.png" alt="Rittik Mobile Shop">
    </div>

    <!-- Main Content -->
    <div id="mainContent">
        <!-- Header -->
        <div class="header">
            <a href="index.html" class="logo-section">
                <img src="logo.png" alt="Logo" class="logo-img">
                <h2 class="logo-text">Rittik <span>Mobile Shop</span></h2>
            </a>
            <div class="header-actions">
                <button class="login-btn" id="loginBtn" onclick="googleLogin()">Login</button>
                <img src="" class="user-avatar" id="userAvatar" onclick="window.location.href='profile.html'">
                <div class="text-avatar" id="textAvatar" onclick="window.location.href='profile.html'"></div>
            </div>
        </div>

        <!-- Search Bar with Live Dropdown -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Search mobiles, brands..." onkeyup="liveSearch()">
            <div id="searchDropdown" class="search-dropdown"></div>
        </div>

        <!-- Scrolling Brands -->
        <div class="brand-scroll">
            <div class="brand-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" style="filter:invert(1);"></div>
            <div class="brand-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Samsung_wordmark.svg" style="filter:invert(1);"></div>
            <div class="brand-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/Vivo_mobile_logo.png"></div>
            <div class="brand-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Realme_logo.png"></div>
            <div class="brand-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d4/Oppo_logo_2019.png"></div>
            <div class="brand-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/2/29/Xiaomi_logo.svg"></div>
        </div>

        <!-- Banner -->
        <div class="banner">
            <h2>Premium Devices</h2>
            <p>আপনার বাড়িতে বসে বা আমাদের দোকান থেকে</p>
        </div>

        <!-- Services Grid (Restored) -->
        <div class="services-section">
            <h2 class="section-title">Our Services</h2>
            <div class="grid-container">
                <a href="sell.html" class="service-box">
                    <div class="service-icon"><img src="https://s3ng.cashify.in/builder/cd13764b153e46e19f9c6551ee52b5e6.webp"></div>
                    <span>Sell Phone</span>
                </a>
                <a href="#productGrid" class="service-box">
                    <div class="service-icon"><img src="https://s3ng.cashify.in/builder/caa3a1efa51541a5aa37fd292790ea81.webp"></div>
                    <span>Buy Phone</span>
                </a>
                <a href="#" class="service-box">
                    <div class="service-icon"><img src="https://s3ng.cashify.in/builder/f1f0df2917bd410b8da95675c63be2d1.webp"></div>
                    <span>Smartwatches</span>
                </a>
                <a href="#" class="service-box">
                    <div class="service-icon"><img src="https://s3ng.cashify.in/builder/75750a866d214239bf52a47ee57e6674.webp"></div>
                    <span>Accessories</span>
                </a>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="products-section">
            <h2 class="section-title">Latest Gadgets</h2>
            <div class="product-grid" id="productGrid">
                <p style="color:#94a3b8; text-align:center; width:100%;">Loading products...</p>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item active"><img src="https://s3ng.cashify.in/builder/f635449b43954fd1af1d88e7272d5dc2.webp"> Home</a>
            <a href="sell.html" class="nav-item"><img src="https://s3ng.cashify.in/builder/31d6a6d498ca43d4a6eee6cccd421474.webp"> Sell</a>
            <a href="profile.html" class="nav-item"><img src="https://s3ng.cashify.in/builder/60cc75a071de4f729b9377681e594821.webp"> Profile</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, set, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIddmdEKtGl0OI97ky6Q3JJBs2dOzbnbA",
            authDomain: "rittik-mobile-shop-web-1.firebaseapp.com",
            databaseURL: "https://rittik-mobile-shop-web-1-default-rtdb.firebaseio.com",
            projectId: "rittik-mobile-shop-web-1"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getDatabase(app);

        let allProducts = [];

        // Auth State & Avatar Logic
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginBtn').style.display = 'none';
                if (user.photoURL) {
                    document.getElementById('userAvatar').src = user.photoURL;
                    document.getElementById('userAvatar').style.display = 'block';
                } else {
                    const initials = user.displayName ? user.displayName.substring(0,2).toUpperCase() : 'US';
                    document.getElementById('textAvatar').innerText = initials;
                    document.getElementById('textAvatar').style.display = 'flex';
                }
            }
        });

        window.googleLogin = () => { signInWithPopup(auth, provider); }

        // Live Search Dropdown Logic
        window.liveSearch = function() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let dropdown = document.getElementById('searchDropdown');
            dropdown.innerHTML = '';
            
            if(input.length === 0) {
                dropdown.style.display = 'none';
                return;
            }

            let hasResult = false;
            allProducts.forEach(prod => {
                if (prod.name.toLowerCase().includes(input)) {
                    hasResult = true;
                    dropdown.innerHTML += `
                        <div class="search-item" onclick="goToDetails('${prod.id}')">
                            <img src="${prod.image}">
                            <span>${prod.name}</span>
                        </div>
                    `;
                }
            });

            dropdown.style.display = hasResult ? 'block' : 'none';
        }

        // Toggle Favorite (Love)
        window.toggleFav = async function(event, prodId, prodName) {
            event.stopPropagation();
            if(!auth.currentUser) return alert("Please login to add to favorites!");
            
            const btn = event.currentTarget;
            const favRef = ref(db, `users/${auth.currentUser.uid}/favorites/${prodId}`);
            
            const snapshot = await get(favRef);
            if(snapshot.exists()) {
                remove(favRef);
                btn.innerHTML = '♡';
                btn.classList.remove('active');
            } else {
                set(favRef, { name: prodName, addedAt: Date.now() });
                btn.innerHTML = '❤️';
                btn.classList.add('active');
            }
        }

        // Load Products
        onValue(ref(db, 'products'), async (snapshot) => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            allProducts = []; // Reset for search
            const data = snapshot.val();
            
            let favs = {};
            if(auth.currentUser) {
                const favSnap = await get(ref(db, `users/${auth.currentUser.uid}/favorites`));
                if(favSnap.exists()) favs = favSnap.val();
            }

            if (data) {
                Object.keys(data).reverse().forEach(key => {
                    const prod = data[key];
                    if(prod.status !== 'approved' && prod.type !== 'admin') return; 

                    let isFav = favs[key] ? 'active' : '';
                    let heartIcon = favs[key] ? '❤️' : '♡';
                    
                    // Out of stock logic
                    let stockBadge = prod.outOfStock ? `<div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(0,0,0,0.7); color:white; padding:5px 10px; border-radius:5px; font-weight:bold; z-index:5;">Out of Stock</div>` : '';
                    let imgOpacity = prod.outOfStock ? 'opacity: 0.5;' : '';

                    allProducts.push({ id: key, name: prod.name, image: prod.images[0] });

                    grid.innerHTML += `
                        <div class="product-card" onclick="${prod.outOfStock ? '' : `goToDetails('${key}')`}">
                            <div class="fav-btn ${isFav}" onclick="toggleFav(event, '${key}', '${prod.name}')">${heartIcon}</div>
                            ${stockBadge}
                            <div class="slider-container" style="${imgOpacity}"><img src="${prod.images[0]}"></div>
                            <div class="p-title">${prod.name}</div>
                            <div class="p-price">₹ ${prod.price}</div>
                        </div>
                    `;
                });
            }
        });

        window.goToDetails = function(id) {
            window.location.href = `details.html?id=${id}`;
        }
    </script>
</body>
</html>
