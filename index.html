<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rittik Mobile Shop</title>
    <meta property="og:title" content="Rittik Mobile Shop">
    <meta property="og:description" content="Buy and Sell Premium Devices easily.">
    <meta property="og:image" content="https://samimaktar-hw.github.io/RITTIK/logo.png">
    <meta name="theme-color" content="#0f172a"/>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0b1121; color: #f8fafc; padding-bottom: 75px; overflow-x: hidden;}
        
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b1121; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .splash-text { font-size: 32px; font-weight: 900; color: #ffffff; letter-spacing: 1px; text-shadow: 0 0 15px rgba(0, 229, 255, 0.6); }
        .splash-text span { color: #00e5ff; }
        
        .header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(0, 229, 255, 0.3);}
        .logo-section { display: flex; align-items: center; text-decoration: none; gap: 10px; }
        .logo-img { height: 35px; width: 35px; object-fit: contain; border-radius: 8px;}
        .logo-text { color: #ffffff; margin: 0; font-size: 18px; font-weight: 800;}
        .logo-text span { color: #00e5ff; }
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .login-btn { background: linear-gradient(90deg, #0284c7, #00e5ff); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;}
        .user-avatar, .text-avatar { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: none;}
        .text-avatar { background: #00e5ff; color: #0f172a; font-weight: bold; align-items: center; justify-content: center; font-size: 14px; border: 2px solid #fff;}

        .search-container { padding: 10px 20px; background: rgba(15, 23, 42, 0.95); position: sticky; top: 60px; z-index: 40;}
        .search-box { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid rgba(0,229,255,0.3); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 14px;}
        
        /* Fixed Brand Icons */
        .brand-scroll { display: flex; overflow-x: auto; padding: 15px 20px; gap: 15px; background: rgba(30, 41, 59, 0.2); margin-bottom: 10px;}
        .brand-scroll::-webkit-scrollbar { display: none; }
        .brand-icon { width: 55px; height: 55px; background: rgba(30, 41, 59, 0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); cursor: pointer;}
        .brand-icon img { width: 32px; height: 32px; object-fit: contain; }

        .banner { background: radial-gradient(circle at top right, #0284c7, #0f172a 70%); padding: 30px 20px; text-align: center; }
        .banner h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #00e5ff;}
        .banner p { font-size: 13px; color: #94a3b8; font-weight: 500;}

        .services-section { padding: 20px 20px 10px 20px; }
        .section-title { font-size: 16px; margin-bottom: 15px; color: #f8fafc; font-weight: 700; display: flex; align-items: center; gap: 8px;}
        .section-title::before { content: ''; display: inline-block; width: 4px; height: 16px; background: #00e5ff; border-radius: 4px;}
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
        .service-box { text-decoration: none; color: #cbd5e1; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center;}
        .service-icon { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px;}
        .service-icon img { width: 28px; height: 28px; object-fit: contain; }

        /* Perfect Image Grid */
        .products-section { padding: 10px 20px 30px 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .product-card { background: rgba(30, 41, 59, 0.6); border-radius: 12px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); position: relative;}
        
        .fav-btn { position: absolute; top: 12px; right: 12px; background: rgba(15,23,42,0.7); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-size: 16px; color: #fff;}
        .fav-btn.active { color: #ef4444;}
        
        .slider-container { width: 100%; height: 160px; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; background: #fff; border-radius: 8px; padding: 10px;}
        .slider-img { max-width: 100%; max-height: 100%; object-fit: contain;}
        
        .p-title { font-size: 13px; font-weight: 700; color: #f1f5f9; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .p-price { font-size: 16px; color: #00e5ff; font-weight: 800; margin-bottom: 10px;}
        .btn-buy { width: 100%; background: #00e5ff; color: #0f172a; border: none; padding: 8px; border-radius: 6px; font-weight: 800; cursor: pointer;}

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100;}
        .nav-item { text-align: center; color: #64748b; text-decoration: none; font-size: 11px; font-weight: 600;}
        .nav-item.active { color: #00e5ff; }
        .nav-item img { width: 20px; height: 20px; display: block; margin: 0 auto 4px auto; opacity: 0.5; filter: invert(1);}
        .nav-item.active img { opacity: 1; filter: invert(70%); }
    </style>
</head>
<body>

    <div id="splashScreen" style="display: none;">
        <div class="splash-text">Rittik <span>Mobile Shop</span></div>
    </div>

    <div class="header">
        <a href="index.html" class="logo-section">
            <img src="logo.png" alt="Logo" class="logo-img">
            <h2 class="logo-text">Rittik <span>Mobile</span></h2>
        </a>
        <div class="header-actions">
            <button class="login-btn" id="loginBtn" onclick="openAuthModal()">Login</button>
            <img src="" class="user-avatar" id="userAvatar" onclick="window.location.href='profile.html'">
            <div class="text-avatar" id="textAvatar" onclick="window.location.href='profile.html'"></div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Search mobiles, brands..." onkeyup="searchProducts()">
    </div>

    <div class="brand-scroll">
        <div class="brand-icon" onclick="filterByBrand('Apple')"><img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" style="filter:invert(1);"></div>
        <div class="brand-icon" onclick="filterByBrand('Samsung')"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Samsung_wordmark.svg" style="filter:invert(1);"></div>
        <div class="brand-icon" onclick="filterByBrand('Vivo')"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/Vivo_mobile_logo.png"></div>
        <div class="brand-icon" onclick="filterByBrand('Realme')"><img src="https://upload.wikimedia.org/wikipedia/commons/1/13/Realme_logo.svg"></div>
        <div class="brand-icon" onclick="filterByBrand('Oppo')"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d4/Oppo_logo_2019.png"></div>
        <div class="brand-icon" onclick="filterByBrand('Xiaomi')"><img src="https://upload.wikimedia.org/wikipedia/commons/2/29/Xiaomi_logo.svg"></div>
    </div>

    <div class="banner">
        <h2>Buy & Sell Premium Devices</h2>
        <p>আপনার বাড়িতে বসে বা আমাদের দোকান থেকে</p>
    </div>

    <div class="services-section">
        <h2 class="section-title">Our Services</h2>
        <div class="grid-container">
            <a href="sell.html" class="service-box">
                <div class="service-icon"><img src="https://s3ng.cashify.in/builder/cd13764b153e46e19f9c6551ee52b5e6.webp"></div><span>Sell Phone</span>
            </a>
            <a href="#productGrid" class="service-box">
                <div class="service-icon"><img src="https://s3ng.cashify.in/builder/caa3a1efa51541a5aa37fd292790ea81.webp"></div><span>Buy Phone</span>
            </a>
            <a href="#" class="service-box">
                <div class="service-icon"><img src="https://s3ng.cashify.in/builder/f1f0df2917bd410b8da95675c63be2d1.webp"></div><span>Smartwatches</span>
            </a>
            <a href="#" class="service-box">
                <div class="service-icon"><img src="https://s3ng.cashify.in/builder/75750a866d214239bf52a47ee57e6674.webp"></div><span>Accessories</span>
            </a>
        </div>
    </div>

    <div class="products-section">
        <h2 class="section-title">Latest Gadgets</h2>
        <div class="product-grid" id="productGrid">
            <p style="color:#94a3b8; width: 100%; text-align: center;">Loading Products...</p>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item active"><img src="https://s3ng.cashify.in/builder/f635449b43954fd1af1d88e7272d5dc2.webp"> Home</a>
        <a href="sell.html" class="nav-item"><img src="https://s3ng.cashify.in/builder/31d6a6d498ca43d4a6eee6cccd421474.webp"> Sell</a>
        <a href="profile.html" class="nav-item"><img src="https://s3ng.cashify.in/builder/60cc75a071de4f729b9377681e594821.webp"> Profile</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, set, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        if (!sessionStorage.getItem('splashShown')) {
            const splash = document.getElementById('splashScreen');
            splash.style.display = 'flex';
            setTimeout(() => { splash.style.display = 'none'; sessionStorage.setItem('splashShown', 'true'); }, 2500);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBIddmdEKtGl0OI97ky6Q3JJBs2dOzbnbA",
            databaseURL: "https://rittik-mobile-shop-web-1-default-rtdb.firebaseio.com",
            projectId: "rittik-mobile-shop-web-1"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginBtn').style.display = 'none';
                if (user.photoURL) {
                    document.getElementById('userAvatar').src = user.photoURL;
                    document.getElementById('userAvatar').style.display = 'block';
                } else {
                    const name = user.displayName || user.email || "US";
                    document.getElementById('textAvatar').innerText = name.substring(0, 2).toUpperCase();
                    document.getElementById('textAvatar').style.display = 'flex';
                }
            }
        });

        window.searchProducts = function() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('product-card');
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title').toLowerCase();
                cards[i].style.display = title.includes(input) ? "block" : "none";
            }
        }

        // Clicking a brand puts the name in search box and filters
        window.filterByBrand = function(brandName) {
            document.getElementById('searchInput').value = brandName;
            window.searchProducts();
            window.scrollTo({ top: document.getElementById('productGrid').offsetTop - 100, behavior: 'smooth' });
        }

        window.toggleFav = async function(event, prodId, prodName) {
            event.stopPropagation();
            if(!auth.currentUser) return alert("Please Login!");
            const btn = event.currentTarget;
            const favRef = ref(db, `users/${auth.currentUser.uid}/favorites/${prodId}`);
            const snapshot = await get(favRef);
            if(snapshot.exists()) {
                remove(favRef); btn.innerHTML = '♡'; btn.classList.remove('active');
            } else {
                set(favRef, { name: prodName, addedAt: Date.now() });
                btn.innerHTML = '❤️'; btn.classList.add('active');
            }
        }

        onValue(ref(db, 'products'), async (snapshot) => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = ''; 
            const data = snapshot.val();
            
            let favs = {};
            if(auth.currentUser) {
                const favSnap = await get(ref(db, `users/${auth.currentUser.uid}/favorites`));
                if(favSnap.exists()) favs = favSnap.val();
            }

            if (data) {
                Object.keys(data).reverse().forEach(key => {
                    const prod = data[key];
                    // Hide out of stock from home page as requested
                    if(prod.status !== 'approved' && prod.type !== 'admin') return; 
                    if(prod.outOfStock) return; 

                    let isFav = favs[key] ? 'active' : '';
                    let heartIcon = favs[key] ? '❤️' : '♡';
                    let firstImg = (prod.images && prod.images.length > 0) ? prod.images[0] : 'https://via.placeholder.com/150';

                    grid.innerHTML += `
                        <div class="product-card" data-title="${prod.name}">
                            <div class="fav-btn ${isFav}" onclick="toggleFav(event, '${key}', '${prod.name}')">${heartIcon}</div>
                            <div onclick="goToDetails('${key}')">
                                <div class="slider-container"><img class="slider-img" src="${firstImg}"></div>
                                <div class="p-title">${prod.name}</div>
                                <div class="p-price">₹ ${prod.price}</div>
                            </div>
                            <div class="action-buttons">
                                <button class="btn-buy" onclick="goToDetails('${key}')">BUY NOW</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                grid.innerHTML = '<p style="color:#94a3b8; width:100%; text-align:center;">No Products Found.</p>';
            }
        });

        window.goToDetails = function(id) {
            // FIXED: Passing ONLY ID in URL, no extra data.
            window.location.href = `details.html?id=${id}`;
        }
    </script>
</body>
</html>
